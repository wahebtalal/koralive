<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="RTA__hNE_77anrk3rNqn7M_HFcBL1IBt526uUrdxaEI" />
    <title>Koralive - Redirecting to kora.blog</title>
    <link rel="canonical" href="https://kora.blog/" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            max-width: 600px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            animation: fadeIn 0.8s ease-out;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.95;
        }
        
        .redirect-link {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 15px 40px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 1rem 0.5rem;
        }
        
        .redirect-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        
        .redirect-link.alt {
            background: transparent;
            border: 2px solid white;
            color: white;
        }
        
        .redirect-link.alt:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .countdown {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        // Redirect after 5 seconds
        window.setTimeout(function() {
            window.location.href = 'https://kora.blog/';
        }, 5000);
    </script>
</head>
<body>
    <div class="container">
        <h1>🌟 Welcome to Koralive</h1>
        <p>You are being redirected to our main website...</p>
        
        <a href="https://kora.blog/" class="redirect-link">Go to kora.blog →</a>
        <a href="javascript:void(0)" class="redirect-link alt" onclick="clearTimeout()">Wait on this page</a>
        
        <div class="countdown">
            Redirecting in <span id="countdown">5</span> seconds...
        </div>
    </div>

    <script>
        let count = 5;
        const countdownElement = document.getElementById('countdown');
        
        const countdownInterval = setInterval(() => {
            count--;
            countdownElement.textContent = count;
            
            if (count <= 0) {
                clearInterval(countdownInterval);
            }
        }, 1000);
    </script>
</body>
</html>
